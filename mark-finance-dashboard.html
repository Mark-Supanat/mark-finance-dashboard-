<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mark Finance — ภาพรวมพอร์ตและรายรับ-รายจ่าย</title>
<style>
  :root{
    --bg:#F6F4EF;
    --card:#FFFFFF;
    --border:#E7E2D6;
    --text:#211E1A;
    --muted:#8B8578;
    --income:#1F6F54;
    --income-soft:#E7F1EC;
    --expense:#B0402C;
    --expense-soft:#F7E9E6;
    --accent:#B8933E;
    --accent-soft:#F2E9D3;
    --navy:#233044;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    min-height:100vh;padding-bottom:78px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 30px;}
  .view{display:none;}
  .view.active{display:block;}

  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  header.top .greet-label{font-size:12px;color:var(--muted);}
  header.top .greet-name{font-family:var(--serif);font-size:20px;font-weight:600;}
  header.top .date-chip{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:6px 10px;border-radius:20px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(30,25,15,.03);}
  .card h3{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;}
  .card h3 .sub{font-size:11px;color:var(--muted);font-weight:400;font-family:var(--sans);}

  .hero-card{background:linear-gradient(150deg,var(--navy),#31435F);color:#fff;border:none;padding:22px 20px;}
  .hero-card .k{font-size:12px;color:#B9C2D2;margin-bottom:6px;}
  .hero-card .v{font-family:var(--serif);font-size:34px;font-weight:600;}
  .hero-card .chg{font-family:var(--mono);font-size:12px;margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;}
  .hero-card .chg.up{background:rgba(63,174,132,.22);color:#8FE0BE;}
  .hero-card .chg.down{background:rgba(217,99,75,.22);color:#F3A392;}
  .alloc-row{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:2px;}
  .alloc-chip{flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;min-width:88px;}
  .alloc-chip .an{font-size:10px;color:#B9C2D2;}
  .alloc-chip .av{font-family:var(--mono);font-size:13px;margin-top:2px;}

  .split2{display:flex;gap:12px;}
  .stat-box{flex:1;border-radius:10px;padding:12px 14px;}
  .stat-box.in{background:var(--income-soft);}
  .stat-box.out{background:var(--expense-soft);}
  .stat-box .k{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .stat-box .v{font-family:var(--mono);font-size:17px;}
  .stat-box.in .v{color:var(--income);}
  .stat-box.out .v{color:var(--expense);}
  .net-line{margin-top:10px;font-size:12px;color:var(--muted);}
  .net-line b{font-family:var(--mono);font-size:13px;}

  .cat-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:9px;}
  .cat-name{width:88px;color:var(--muted);flex-shrink:0;}
  .cat-bar-track{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--accent);}
  .cat-amt{font-family:var(--mono);width:66px;text-align:right;flex-shrink:0;}

  .tx-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .tx-item:last-child{border-bottom:none;}
  .tx-tag{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .tx-tag.food{background:var(--accent-soft);}
  .tx-tag.tennis{background:#E4ECF0;}
  .tx-tag.fixed{background:#EFE7F2;}
  .tx-tag.other{background:#EEEEEE;}
  .tx-tag.port{background:var(--income-soft);}
  .tx-main{flex:1;min-width:0;}
  .tx-note{font-size:13.5px;}
  .tx-sub{font-size:11px;color:var(--muted);font-family:var(--mono);}
  .tx-amt{font-family:var(--mono);font-size:13.5px;white-space:nowrap;}
  .tx-amt.income{color:var(--income);}
  .tx-amt.expense{color:var(--expense);}

  /* bottom nav */
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20;}
  nav.bottom .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    color:var(--muted);font-family:var(--sans);font-size:10.5px;cursor:pointer;padding:4px 0;}
  nav.bottom .nav-btn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.6;}
  nav.bottom .nav-btn.active{color:var(--accent);}
  nav.bottom .nav-btn.active svg{stroke:var(--accent);}

  /* forms */
  .type-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .type-btn{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-family:var(--sans);font-size:14px;cursor:pointer;}
  .type-btn.active[data-type="รับ"]{background:var(--income-soft);border-color:var(--income);color:var(--income);}
  .type-btn.active[data-type="จ่าย"]{background:var(--expense-soft);border-color:var(--expense);color:var(--expense);}
  .form-row{display:flex;gap:10px;margin-bottom:10px;}
  .form-row > *{flex:1;min-width:0;}
  label.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  input, select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 10px;font-family:var(--mono);font-size:14px;}
  select{font-family:var(--sans);}
  input:focus, select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button.submit{width:100%;padding:11px 0;border-radius:8px;border:none;background:var(--accent);color:#2A2103;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;}
  button.submit:disabled{opacity:.5;}
  button.ghost{width:100%;padding:10px 0;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;margin-top:4px;}

  /* month tabs */
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;}
  .tab{flex:0 0 auto;padding:9px 14px;font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px;}
  .tab.closed{border-bottom:3px double var(--expense);}
  .tab.active{background:var(--card);color:var(--text);}
  .tab.active:not(.closed){border-bottom:2px solid var(--accent);}
  .month-panel{background:var(--card);border:1px solid var(--border);border-radius:0 10px 10px 10px;padding:16px;margin-bottom:16px;}
  .closing-line{margin-top:14px;padding-top:10px;border-top:3px double var(--expense);text-align:center;font-size:11px;color:var(--expense);}
  table.tx{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.tx th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;padding:0 4px 6px;border-bottom:1px solid var(--border);}
  table.tx td{padding:7px 4px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.tx tr:last-child td{border-bottom:none;}
  td.date-col{font-family:var(--mono);color:var(--muted);white-space:nowrap;}
  td.amt-col{font-family:var(--mono);text-align:right;white-space:nowrap;}
  td.amt-col.income{color:var(--income);}
  td.amt-col.expense{color:var(--expense);}
  .cat-tag-sm{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;}
  .del-btn{background:none;border:none;color:#C9C2B2;cursor:pointer;font-size:13px;}
  .del-btn:hover{color:var(--expense);}
  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}

  /* portfolio bars */
  .bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-bottom:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-fill{width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;}
  .bar-label{font-size:9px;color:var(--muted);margin-top:5px;font-family:var(--mono);}
  .asset-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:9px;}
  .asset-name{width:96px;color:var(--text);flex-shrink:0;}
  .asset-bar-track{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden;}
  .asset-bar-fill{height:100%;background:var(--navy);}
  .asset-amt{font-family:var(--mono);width:70px;text-align:right;flex-shrink:0;}

  .section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 10px;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="greet-label">สวัสดี</div>
      <div class="greet-name">Mark</div>
    </div>
    <div class="date-chip" id="todayChip"></div>
  </header>

  <!-- DASHBOARD -->
  <div class="view active" id="view-dashboard">
    <div class="card hero-card">
      <div class="k">พอร์ตรวมล่าสุด</div>
      <div class="v" id="portTotal">฿0</div>
      <div class="chg" id="portChg"></div>
      <div class="alloc-row" id="allocRow"></div>
    </div>

    <div class="card">
      <h3>รายรับ-รายจ่าย <span class="sub" id="dashMonthLabel"></span></h3>
      <div class="split2">
        <div class="stat-box in"><div class="k">รับ</div><div class="v" id="dIncome">฿0</div></div>
        <div class="stat-box out"><div class="k">จ่าย</div><div class="v" id="dExpense">฿0</div></div>
      </div>
      <div class="net-line">สุทธิเดือนนี้: <b id="dNet">฿0</b></div>
    </div>

    <div class="card">
      <h3>รายจ่ายตามหมวดหมู่ <span class="sub">เดือนนี้</span></h3>
      <div id="dashCatBars"></div>
    </div>

    <div class="card">
      <h3>รายการล่าสุด</h3>
      <div id="recentTx"></div>
    </div>
  </div>

  <!-- TRANSACTIONS -->
  <div class="view" id="view-transactions">
    <div class="card">
      <h3>เพิ่มรายการ</h3>
      <form id="txForm">
        <div class="type-toggle" id="typeToggle">
          <button type="button" class="type-btn active" data-type="จ่าย">จ่าย</button>
          <button type="button" class="type-btn" data-type="รับ">รับ</button>
        </div>
        <div class="form-row">
          <div><label class="field-label">วันที่</label><input type="date" id="fDate" required></div>
          <div><label class="field-label">จำนวนเงิน</label><input type="number" id="fAmount" step="0.01" min="0" placeholder="0" required></div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label">หมวดหมู่</label>
            <select id="fCategory">
              <option>อาหาร</option><option>เทนนิส</option><option>ค่าใช้จ่ายคงที่</option><option selected>อื่นๆ</option>
            </select>
          </div>
          <div><label class="field-label">หมายเหตุ</label><input type="text" id="fNote" placeholder="เช่น ข้าวเยง"></div>
        </div>
        <button type="submit" class="submit" id="submitBtn">บันทึกรายการ</button>
      </form>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="month-panel" id="monthPanel"></div>
  </div>

  <!-- PORTFOLIO -->
  <div class="view" id="view-portfolio">
    <div class="card">
      <h3>แนวโน้มพอร์ตรวมรายเดือน <span class="sub">2026</span></h3>
      <div class="bars" id="allocBars"></div>
    </div>
    <div class="card">
      <h3>สัดส่วนล่าสุด <span class="sub" id="allocMonthLabel"></span></h3>
      <div id="assetBreakdown"></div>
    </div>
    <div class="card">
      <h3>เพิ่มยอดพอร์ตประจำเดือน</h3>
      <form id="allocForm">
        <div class="form-row">
          <div><label class="field-label">เดือน</label><input type="month" id="aMonth" required></div>
          <div><label class="field-label">หุ้นไทย+TFEX</label><input type="number" id="aThai" step="1" placeholder="0"></div>
        </div>
        <div class="form-row">
          <div><label class="field-label">Forex</label><input type="number" id="aForex" step="1" placeholder="0"></div>
          <div><label class="field-label">เงินสด</label><input type="number" id="aCash" step="1" placeholder="0"></div>
        </div>
        <div class="form-row">
          <div><label class="field-label">หุ้นเมกา+จีน</label><input type="number" id="aMega" step="1" placeholder="0"></div>
          <div><label class="field-label">คริปโต</label><input type="number" id="aCrypto" step="1" placeholder="0"></div>
        </div>
        <button type="submit" class="submit">บันทึกยอดเดือนนี้</button>
      </form>
    </div>
    <div class="card">
      <h3>รายการโอนพอร์ตเทรด</h3>
      <div id="portfolioLog"></div>
    </div>
  </div>

  <!-- INSIGHTS -->
  <div class="view" id="view-insights">
    <div class="card">
      <h3>รายจ่ายตามหมวดหมู่ <span class="sub">สะสมทั้งหมด</span></h3>
      <div id="insCatBars"></div>
    </div>
    <div class="card">
      <h3>แนวโน้มรายจ่ายรายเดือน</h3>
      <div class="bars" id="insBars"></div>
    </div>
  </div>

</div>

<nav class="bottom">
  <button class="nav-btn active" data-view="dashboard">
    <svg viewBox="0 0 24 24"><path d="M3 11L12 4l9 7"/><path d="M5 10v9h14v-9"/></svg>
    Dashboard
  </button>
  <button class="nav-btn" data-view="transactions">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
    รายรับ-จ่าย
  </button>
  <button class="nav-btn" data-view="portfolio">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 3.3"/></svg>
    พอร์ต
  </button>
  <button class="nav-btn" data-view="insights">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
    Insights
  </button>
</nav>

let txns = [];

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return THAI_MONTHS[m-1] + ' ' + y;
}
function fmtAmt(n){ return new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function loadJSON(key, seed){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null){
      localStorage.setItem(key, JSON.stringify(seed));
      return JSON.parse(JSON.stringify(seed));
    }
    return JSON.parse(raw);
  }catch(e){
    console.error('load failed for', key, e);
    return JSON.parse(JSON.stringify(seed));
  }
}
function saveJSON(key, data){
  try{ localStorage.setItem(key, JSON.stringify(data)); }
  catch(e){ console.error('save failed for', key, e); }
}

function init(){
  document.getElementById('todayChip').textContent = todayISO();
  document.getElementById('fDate').value = todayISO();

  txns = loadJSON(LS_TX, SEED_TX);
  ptxns = loadJSON(LS_PF, SEED_PF);
  alloc = loadJSON(LS_AL, SEED_AL);

  txns.sort((a,b)=>a.date.localeCompare(b.date));
  ptxns.sort((a,b)=>a.date.localeCompare(b.date));
  alloc.sort((a,b)=>a.month.localeCompare(b.month));

  activeMonth = todayISO().slice(0,7);

  renderDashboard();
  renderTransactionsTab();
  renderPortfolioTab();
  renderInsightsTab();
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const latest = alloc[alloc.length-1];
  const prev = alloc[alloc.length-2];
  document.getElementById('portTotal').textContent = '฿' + fmtAmt(latest ? latest.total : 0);
  const chgEl = document.getElementById('portChg');
  if(latest && prev){
    const diff = latest.total - prev.total;
    const pct = prev.total ? (diff/prev.total*100) : 0;
    chgEl.className = 'chg ' + (diff>=0?'up':'down');
    chgEl.textContent = (diff>=0?'▲ ':'▼ ') + (diff>=0?'+':'') + pct.toFixed(1) + '% เทียบเดือนก่อน';
  }else{
    chgEl.textContent = '';
  }
  const allocRow = document.getElementById('allocRow');
  if(latest){
    const items = [
      ['หุ้นไทย+TFEX', latest.thai_stock], ['Forex', latest.forex], ['เงินสด', latest.cash],
      ['หุ้นเมกา', latest.mega_stock], ['คริปโต', latest.crypto]
    ];
    allocRow.innerHTML = items.map(([n,v])=>
      '<div class="alloc-chip"><div class="an">'+n+'</div><div class="av">฿'+fmtAmt(v)+'</div></div>'
    ).join('');
  }

  const curMonth = todayISO().slice(0,7);
  document.getElementById('dashMonthLabel').textContent = monthLabel(curMonth);
  const monthTx = txns.filter(t=>monthKey(t.date)===curMonth);
  const income = monthTx.filter(t=>t.type==='รับ').reduce((s,t)=>s+Number(t.amount),0);
  const expense = monthTx.filter(t=>t.type==='จ่าย').reduce((s,t)=>s+Number(t.amount),0);
  document.getElementById('dIncome').textContent = '฿'+fmtAmt(income);
  document.getElementById('dExpense').textContent = '฿'+fmtAmt(expense);
  const net = income-expense;
  const netEl = document.getElementById('dNet');
  netEl.textContent = (net<0?'-':'') + '฿' + fmtAmt(Math.abs(net));
  netEl.style.color = net<0 ? 'var(--expense)' : 'var(--income)';

  const catTotals = CATS.map(c=>({
    cat:c, amt: monthTx.filter(t=>t.type==='จ่าย' && t.category===c).reduce((s,t)=>s+Number(t.amount),0)
  }));
  const maxCat = Math.max(1, ...catTotals.map(c=>c.amt));
  document.getElementById('dashCatBars').innerHTML = catTotals.map(c=>{
    const pct = Math.round((c.amt/maxCat)*100);
    return '<div class="cat-row"><div class="cat-name">'+c.cat+'</div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%"></div></div><div class="cat-amt">฿'+fmtAmt(c.amt)+'</div></div>';
  }).join('');

  const merged = [
    ...txns.map(t=>({date:t.date, note:t.note||'-', cat:t.category, amount:t.amount, sign:t.type==='รับ'?1:-1, kind:'personal'})),
    ...ptxns.map(p=>({date:p.date, note:(p.note||p.account), cat:p.account, amount:(p.income||p.expense), sign:p.income?1:-1, kind:'portfolio'}))
  ].sort((a,b)=> b.date.localeCompare(a.date)).slice(0,7);
  document.getElementById('recentTx').innerHTML = merged.map(m=>{
    const tagClass = m.kind==='portfolio' ? 'port' : (CAT_TAG_CLASS[m.cat]||'other');
    const emoji = m.kind==='portfolio' ? '◎' : (m.cat==='อาหาร'?'🍜':m.cat==='เทนนิส'?'🎾':m.cat==='ค่าใช้จ่ายคงที่'?'🧾':'•');
    return '<div class="tx-item"><div class="tx-tag '+tagClass+'">'+emoji+'</div>' +
      '<div class="tx-main"><div class="tx-note">'+m.note+'</div><div class="tx-sub">'+m.date+' · '+m.cat+'</div></div>' +
      '<div class="tx-amt '+(m.sign>0?'income':'expense')+'">'+(m.sign>0?'+':'-')+'฿'+fmtAmt(m.amount)+'</div></div>';
  }).join('') || '<div class="empty-note">ยังไม่มีรายการ</div>';
}

/* ---------- TRANSACTIONS TAB ---------- */
function allMonthKeys(){
  const cur = todayISO().slice(0,7);
  const keys = Array.from(new Set(txns.map(t=>monthKey(t.date))));
  if(!keys.includes(cur)) keys.push(cur);
  keys.sort();
  return keys;
}

function renderTransactionsTab(){
  const keys = allMonthKeys();
  if(!keys.includes(activeMonth)) activeMonth = keys[keys.length-1];
  renderTabs(keys);
  renderMonthPanel(activeMonth);
}

function renderTabs(keys){
  const cur = todayISO().slice(0,7);
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  keys.forEach(k=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (k===activeMonth?' active':'') + (k<cur?' closed':'');
    btn.textContent = monthLabel(k);
    btn.onclick = ()=>{ activeMonth = k; renderTabs(keys); renderMonthPanel(k); };
    tabsEl.appendChild(btn);
  });
  tabsEl.scrollLeft = tabsEl.scrollWidth;
}

function renderMonthPanel(key){
  const panel = document.getElementById('monthPanel');
  const monthTx = txns.filter(t=>monthKey(t.date)===key).sort((a,b)=>a.date.localeCompare(b.date));
  if(monthTx.length===0){
    panel.innerHTML = '<div class="empty-note">ยังไม่มีรายการเดือนนี้ — เพิ่มรายการด้านบนได้เลย</div>';
    return;
  }
  let html = '<table class="tx"><thead><tr><th>วันที่</th><th>รายการ</th><th style="text-align:right">จำนวน</th><th></th></tr></thead><tbody>';
  monthTx.forEach(t=>{
    const d = t.date.slice(8,10)+'/'+t.date.slice(5,7);
    html += '<tr><td class="date-col">'+d+'</td>' +
      '<td>'+(t.note||'-')+'<span class="cat-tag-sm">'+t.category+'</span></td>' +
      '<td class="amt-col '+(t.type==='รับ'?'income':'expense')+'">'+(t.type==='รับ'?'+':'-')+'฿'+fmtAmt(t.amount)+'</td>' +
      '<td style="text-align:right"><button class="del-btn" data-id="'+t.id+'">×</button></td></tr>';
  });
  html += '</tbody></table>';
  const cur = todayISO().slice(0,7);
  if(key < cur) html += '<div class="closing-line">ปิดบัญชีเดือน '+monthLabel(key)+' แล้ว</div>';
  panel.innerHTML = html;
  panel.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick = ()=>{
      txns = txns.filter(t=>t.id!==btn.dataset.id);
      saveJSON(LS_TX, txns);
      renderTransactionsTab(); renderDashboard(); renderInsightsTab();
    };
  });
}

document.getElementById('typeToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('.type-btn');
  if(!btn) return;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedType = btn.getAttribute('data-type');
});

document.getElementById('txForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  const date = document.getElementById('fDate').value || todayISO();
  const amount = parseFloat(document.getElementById('fAmount').value);
  const category = document.getElementById('fCategory').value;
  const note = document.getElementById('fNote').value.trim();
  if(!amount || amount<=0){ submitBtn.disabled=false; return; }
  txns.push({ id: uid(), date, type: selectedType, amount, category, note });
  saveJSON(LS_TX, txns);
  activeMonth = monthKey(date);
  renderTransactionsTab(); renderDashboard(); renderInsightsTab();
  document.getElementById('fAmount').value = '';
  document.getElementById('fNote').value = '';
  submitBtn.disabled = false;
});

/* ---------- PORTFOLIO TAB ---------- */
function renderPortfolioTab(){
  const bars = document.getElementById('allocBars');
  const max = Math.max(1, ...alloc.map(a=>a.total));
  bars.innerHTML = alloc.map(a=>{
    const h = Math.max(3, Math.round((a.total/max)*100));
    const m = a.month.split('-')[1];
    return '<div class="bar-col"><div class="bar-fill" style="height:'+h+'%" title="฿'+fmtAmt(a.total)+'"></div><div class="bar-label">'+THAI_MONTHS[Number(m)-1]+'</div></div>';
  }).join('');

  const latest = alloc[alloc.length-1];
  document.getElementById('allocMonthLabel').textContent = latest ? monthLabel(latest.month) : '';
  if(latest){
    const items = [
      ['หุ้นไทย+TFEX', latest.thai_stock], ['Forex', latest.forex], ['เงินสด', latest.cash],
      ['หุ้นเมกา+จีน', latest.mega_stock], ['คริปโต', latest.crypto]
    ];
    const maxA = Math.max(1, ...items.map(i=>i[1]));
    document.getElementById('assetBreakdown').innerHTML = items.map(([n,v])=>{
      const pct = Math.round((v/maxA)*100);
      return '<div class="asset-row"><div class="asset-name">'+n+'</div><div class="asset-bar-track"><div class="asset-bar-fill" style="width:'+pct+'%"></div></div><div class="asset-amt">฿'+fmtAmt(v)+'</div></div>';
    }).join('');
  }

  const log = document.getElementById('portfolioLog');
  const sorted = ptxns.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
  log.innerHTML = '<table class="tx"><thead><tr><th>วันที่</th><th>บัญชี</th><th>รายการ</th><th style="text-align:right">จำนวน</th></tr></thead><tbody>' +
    sorted.map(p=>{
      const d = p.date.slice(8,10)+'/'+p.date.slice(5,7);
      const isIn = p.income>0;
      return '<tr><td class="date-col">'+d+'</td><td>'+p.account+'</td><td>'+(p.note||'-')+'</td>' +
        '<td class="amt-col '+(isIn?'income':'expense')+'">'+(isIn?'+':'-')+'฿'+fmtAmt(isIn?p.income:p.expense)+'</td></tr>';
    }).join('') + '</tbody></table>';
}

document.getElementById('allocForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const month = document.getElementById('aMonth').value;
  if(!month) return;
  const thai = parseFloat(document.getElementById('aThai').value)||0;
  const forex = parseFloat(document.getElementById('aForex').value)||0;

  saveJSON(LS_AL, alloc);
  renderPortfolioTab(); renderDashboard();
  e.target.reset();
});

/* ---------- INSIGHTS TAB ---------- */
function renderInsightsTab(){
  const expenseTx = txns.filter(t=>t.type==='จ่าย');
  const catTotals = CATS.map(c=>({cat:c, amt: expenseTx.filter(t=>t.category===c).reduce((s,t)=>s+Number(t.amount),0)}));
  const maxCat = Math.max(1, ...catTotals.map(c=>c.amt));
  document.getElementById('insCatBars').innerHTML = catTotals.map(c=>{
    const pct = Math.round((c.amt/maxCat)*100);
    return '<div class="cat-row"><div class="cat-name">'+c.cat+'</div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%"></div></div><div class="cat-amt">฿'+fmtAmt(c.amt)+'</div></div>';
  }).join('');

  const byMonth = {};
  expenseTx.forEach(t=>{
    const k = monthKey(t.date);
    byMonth[k] = (byMonth[k]||0) + Number(t.amount);
  });
  const keys = Object.keys(byMonth).sort();
  const maxM = Math.max(1, ...keys.map(k=>byMonth[k]));
  document.getElementById('insBars').innerHTML = keys.map(k=>{
    const h = Math.max(3, Math.round((byMonth[k]/maxM)*100));
    const m = Number(k.split('-')[1]);
    return '<div class="bar-col"><div class="bar-fill" style="height:'+h+'%" title="฿'+fmtAmt(byMonth[k])+'"></div><div class="bar-label">'+THAI_MONTHS[m-1]+'</div></div>';
  }).join('');
}

init();
</script>
